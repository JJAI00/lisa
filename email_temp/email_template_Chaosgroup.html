    <table border="1" cellpadding="6" cellspacing="0" style="border-collapse: collapse; font-size: 10pt;">

            <td>{customer}</td>
            <td>{product}</td>
            <td>{qty}</td>
            <td>{expiry}</td>

    <p>리뉴얼 진행이나 기타 문의사항이 있으시면 김한경 팀장(kimhk@qvrex.co.kr)에게 언제든지 회신 부탁드립니다.</p>
